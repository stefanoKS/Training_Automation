<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img">
  <title>patchcore stages</title>
  <rect x="0" y="0" width="900" height="590" fill="white" stroke="#d0d7de" />
  <text x="24" y="36" font-size="23" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="182.50">patchcore stages</text>
  <text x="24" y="572" font-size="15" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="413.00">出典 / source: schematic; source-checked course constants</text>
  <rect x="24" y="62" width="414" height="141" fill="#f6f8fa" stroke="#1f6feb" />
  <text x="38" y="91" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1f6feb" data-text-width="213.50">① 正常画像 / normal fit</text>
  <text x="38" y="121" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="224.50">Frozen pretrained resnet18</text>
  <text x="38" y="148" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="244.50">No backbone-weight updates</text>
  <rect x="462" y="62" width="414" height="141" fill="#f6f8fa" stroke="#9a6700" />
  <text x="476" y="91" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#9a6700" data-text-width="197.00">② 特徴 / embeddings</text>
  <text x="476" y="121" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="248.50">layer2 + layer3 patch features</text>
  <text x="476" y="148" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="269.50">Coreset -&gt; normal memory bank</text>
  <rect x="24" y="219" width="414" height="141" fill="#f6f8fa" stroke="#8250df" />
  <text x="38" y="248" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#8250df" data-text-width="212.00">③ 試験入力 / inference</text>
  <text x="38" y="278" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="290.00">Same preprocessing and backbone</text>
  <text x="38" y="305" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="236.50">New patch -&gt; feature vector</text>
  <rect x="462" y="219" width="414" height="141" fill="#f6f8fa" stroke="#1a7f37" />
  <text x="476" y="248" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1a7f37" data-text-width="252.00">④ 距離 / nearest neighbour</text>
  <text x="476" y="278" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="294.00">Compare to stored normal features.</text>
  <text x="476" y="305" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="263.50">Distance -&gt; map + image score</text>
  <rect x="24" y="376" width="414" height="141" fill="#f6f8fa" stroke="#a40e26" />
  <text x="38" y="405" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#a40e26" data-text-width="225.00">⑤ 較正 / calibration only</text>
  <text x="38" y="435" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="278.50">Fit separate score/map statistics.</text>
  <text x="38" y="462" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="290.00">Freeze memory and postprocessor.</text>
  <rect x="462" y="376" width="414" height="141" fill="#f6f8fa" stroke="#9a6700" />
  <text x="476" y="405" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#9a6700" data-text-width="210.50">⑥ 注意 / interpretation</text>
  <text x="476" y="435" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="266.50">2D feature sketches are not x/y.</text>
  <text x="476" y="462" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="289.00">Image score != displayed map max</text>
  <line x1="438" y1="132" x2="459" y2="132" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="128" x2="459" y2="132" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="136" x2="459" y2="132" stroke="#9a6700" stroke-width="2" />
  <line x1="438" y1="289" x2="459" y2="289" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="285" x2="459" y2="289" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="293" x2="459" y2="289" stroke="#9a6700" stroke-width="2" />
  <line x1="438" y1="446" x2="459" y2="446" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="442" x2="459" y2="446" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="450" x2="459" y2="446" stroke="#9a6700" stroke-width="2" />
</svg>