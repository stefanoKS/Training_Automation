<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img">
  <title>mass units chain</title>
  <rect x="0" y="0" width="900" height="590" fill="white" stroke="#d0d7de" />
  <text x="24" y="36" font-size="23" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="179.50">mass units chain</text>
  <text x="24" y="572" font-size="15" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="413.00">出典 / source: schematic; source-checked course constants</text>
  <rect x="24" y="62" width="414" height="141" fill="#f6f8fa" stroke="#1f6feb" />
  <text x="38" y="91" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1f6feb" data-text-width="153.00">① 長さ / lengths</text>
  <text x="38" y="121" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="171.00">1300 mm x 2500 mm</text>
  <text x="38" y="148" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="172.50">thickness = 0.35 mm</text>
  <rect x="462" y="62" width="414" height="141" fill="#f6f8fa" stroke="#9a6700" />
  <text x="476" y="91" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#9a6700" data-text-width="151.50">② 体積 / volume</text>
  <text x="476" y="121" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="215.00">width x length x thickness</text>
  <text x="476" y="148" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="191.50">mm x mm x mm = mm³</text>
  <rect x="24" y="219" width="414" height="141" fill="#f6f8fa" stroke="#8250df" />
  <text x="38" y="248" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#8250df" data-text-width="225.50">③ 換算 / convert volume</text>
  <text x="38" y="278" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="168.00">volume_mm3 / 1000</text>
  <text x="38" y="305" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="172.00">= volume_cm3 (cm³)</text>
  <rect x="462" y="219" width="414" height="141" fill="#f6f8fa" stroke="#1a7f37" />
  <text x="476" y="248" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1a7f37" data-text-width="152.00">④ 密度 / density</text>
  <text x="476" y="278" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="79.50">1.4 g/cm³</text>
  <text x="476" y="305" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="223.50">volume_cm3 x density -&gt; g</text>
  <rect x="24" y="376" width="414" height="141" fill="#f6f8fa" stroke="#a40e26" />
  <text x="38" y="405" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#a40e26" data-text-width="134.00">⑤ 重さ / mass</text>
  <text x="38" y="435" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="171.50">mass_g / 1000 -&gt; kg</text>
  <text x="38" y="462" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="258.50">Calculate the exercise yourself.</text>
  <rect x="462" y="376" width="414" height="141" fill="#f6f8fa" stroke="#9a6700" />
  <text x="476" y="405" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#9a6700" data-text-width="185.00">⑥ 区別 / distinguish</text>
  <text x="476" y="435" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="244.00">Area uses two lengths (mm²).</text>
  <text x="476" y="462" font-size="18" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="215.00">Volume uses three (mm³).</text>
  <line x1="438" y1="132" x2="459" y2="132" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="128" x2="459" y2="132" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="136" x2="459" y2="132" stroke="#9a6700" stroke-width="2" />
  <line x1="438" y1="289" x2="459" y2="289" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="285" x2="459" y2="289" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="293" x2="459" y2="289" stroke="#9a6700" stroke-width="2" />
  <line x1="438" y1="446" x2="459" y2="446" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="442" x2="459" y2="446" stroke="#9a6700" stroke-width="2" />
  <line x1="453" y1="450" x2="459" y2="446" stroke="#9a6700" stroke-width="2" />
</svg>