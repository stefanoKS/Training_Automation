<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img">
  <title>同じ平面の校正 / same-plane calibration</title>
  <rect x="0" y="0" width="900" height="590" fill="white" stroke="#d0d7de" />
  <text x="24" y="36" font-size="23" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="430.50">同じ平面の校正 / same-plane calibration</text>
  <text x="24" y="572" font-size="15" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="386.00">出典 / source: computed synthetic; calibrated_defects()</text>
  <rect x="50" y="105" width="320" height="240" fill="#d2d2d2" stroke="#d0d7de" />
  <rect x="110" y="145" width="25" height="19" fill="#282828" stroke="#282828" />
  <rect x="200" y="195" width="37" height="25" fill="#282828" stroke="#282828" />
  <line x1="80" y1="295" x2="200" y2="295" stroke="#1f6feb" stroke-width="2" />
  <line x1="80" y1="288" x2="80" y2="302" stroke="#1f6feb" stroke-width="2" />
  <line x1="200" y1="288" x2="200" y2="302" stroke="#1f6feb" stroke-width="2" />
  <line x1="320" y1="165" x2="320" y2="225" stroke="#1a7f37" stroke-width="2" />
  <text x="50" y="82" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1f6feb" data-text-width="324.00">320 × 240 px（理想的な同一平面）</text>
  <text x="50" y="382" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1f6feb" data-text-width="248.50">青 / blue: 120 px = 100 mm</text>
  <text x="50" y="419" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1a7f37" data-text-width="239.50">緑 / green: 60 px = 50 mm</text>
  <text x="422" y="134" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="229.50">px/mm = 120 / 100 = 1.2</text>
  <text x="422" y="177" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="256.50">mm/px = 1 / 1.2 = 0.833333</text>
  <text x="422" y="220" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#1a7f37" data-text-width="224.50">Check: 60 / 1.2 = 50 mm</text>
  <text x="422" y="263" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="283.00">length_mm = length_px / scale</text>
  <text x="422" y="306" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="279.50">area_mm2 = area_px2 / scale²</text>
  <text x="422" y="349" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="308.50">Contour area != foreground count</text>
  <text x="50" y="476" font-size="21" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#9a6700" data-text-width="567.00">同じ平面・正方画素。傾き、歪み、基準の不確かさを確認。</text>
  <text x="50" y="515" font-size="20" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#24292f" data-text-width="583.00">Same plane, square pixels; check tilt, distortion and uncertainty.</text>
</svg>