<text x="700.0" y="350.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">並列はOR。直列はAND。NC接点は否定。</text>
<text x="700.0" y="375.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">series is AND; parallel is OR; an NC contact negates</text>
<rect x="70.0" y="500.0" width="620.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#C1D0DD" stroke-width="1.4"/>
<text x="86.0" y="530.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="19" fill="#142B3F" font-weight="700" text-anchor="start">物理接点</text>
<text x="86.0" y="552.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#526378" font-weight="400" text-anchor="start">physical contact</text>
<text x="90.0" y="590.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="400" text-anchor="start">物理NCのSTOPを、健全時にPLC入力ONとなるように配線する。</text>
<text x="90.0" y="618.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">Wire a physical NC stop so the PLC input is ON while healthy.</text>
<text x="90.0" y="670.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="400" text-anchor="start">プログラムでは「ONで許可」として使う。</text>
<text x="90.0" y="698.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">In the program the state is used as an ON permission.</text>
<text x="90.0" y="750.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#B4541E" font-weight="700" text-anchor="start">断線したときにONかOFFかを設計者が理解する。</text>
<text x="90.0" y="775.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#526378" font-weight="400" text-anchor="start">Know whether a broken wire produces ON or OFF.</text>
