<text x="1210.0" y="568.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="middle">on-delay</text>
<path d="M1060.0 600.0 L1148.0 600.0" fill="none" stroke="#2563A6" stroke-width="2.4"/>
<text x="770.0" y="700.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="400" text-anchor="start">T0はM0がONの間だけ時間を数える。</text>
<text x="770.0" y="728.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">T0 counts only while M0 is ON.</text>
<text x="770.0" y="770.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="700" text-anchor="start">図の接点は論理状態の評価であり、実接点や実電流ではない。</text>
<rect x="70.0" y="840.0" width="1300.0" height="78.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1.2"/>
<text x="88.0" y="870.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="700" text-anchor="start">物理的にNCのスイッチを、必ずNC論理接点で使う規則はない。</text>
<text x="88.0" y="894.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">There is no rule that a physically NC switch must use an NC logical instruction.</text>
