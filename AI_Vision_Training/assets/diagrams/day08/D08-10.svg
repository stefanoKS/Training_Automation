<text x="76.0" y="958.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">STARTを離してもM0は続く。T0はM0の間だけ進み、3秒でY1がON。STOPで全てリセット。</text>
<text x="76.0" y="980.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">M0 continues after START release. T0 advances while RUN is on; Y1 turns on at 3 s. STOP resets all.</text>
