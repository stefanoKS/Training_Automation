<text x="222.0" y="418.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">restart permit</text>
<text x="80.0" y="630.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="20" fill="#142B3F" font-weight="700" text-anchor="start">すべての遷移には「理由」があります。理由のない遷移は設計の穴です。</text>
<text x="80.0" y="656.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="400" text-anchor="start">Every transition has a reason; an unexplained transition is a design gap.</text>
<rect x="80.0" y="686.0" width="1280.0" height="96.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="100.0" y="712.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#142B3F" font-weight="700" text-anchor="start">異常停止のあとの自動再起動は危険な場合があります。再起動は人が許可する設計を検討します。</text>
<text x="100.0" y="736.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">Automatic restart after an unexpected stop can be hazardous; consider authorization by a person.</text>
<text x="100.0" y="762.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#A32B2B" font-weight="700" text-anchor="start">品質のNGと機械の故障は別の状態です。混ぜると対応を誤ります。</text>
<rect x="56.0" y="824.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="858.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">状態と遷移条件を表にして、全員が同じ理解を持つようにします。</text>
<text x="76.0" y="880.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">A state/transition table gives everyone the same understanding.</text>
