<text x="80.0" y="626.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="19" fill="#142B3F" font-weight="700" text-anchor="start">PLC内部では、ビット（X/Y/M）と数値レジスタ（Dなど）を使い分けます。</text>
<text x="80.0" y="652.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="400" text-anchor="start">Inside the PLC, bits (X/Y/M) and numeric registers (such as D) serve different purposes.</text>
<text x="80.0" y="686.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#A32B2B" font-weight="700" text-anchor="start">装置名・番号・命令の意味はCPUとソフトの版で必ず確認します。</text>
<text x="80.0" y="712.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">Always confirm device names, numbers and instructions for the actual CPU and software version.</text>
<rect x="56.0" y="744.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="778.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">PLCは入力・判断・出力を繰り返す産業用の制御装置です。</text>
<text x="76.0" y="800.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">A PLC repeatedly samples inputs, evaluates logic and updates outputs.</text>
