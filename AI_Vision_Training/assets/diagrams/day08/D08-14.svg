<text x="110.0" y="620.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#142B3F" font-weight="400" text-anchor="start">指令と確認は別。確認が来ない場合を設計する。</text>
<text x="110.0" y="648.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#526378" font-weight="400" text-anchor="start">Commands and confirmations differ; design the missing-confirmation case.</text>
<text x="110.0" y="690.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#B4541E" font-weight="700" text-anchor="start">電磁弁OFF＝必ず停止、ではない。ばね戻りでは動くことがある。</text>
<text x="110.0" y="712.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#526378" font-weight="400" text-anchor="start">OFF does not always mean stopped; a spring-return valve can move.</text>
