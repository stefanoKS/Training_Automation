<text x="88.0" y="814.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">NPN/PNP describe the output interface, not the detection principle. Wire colours are examples; follow the datasheet.</text>
<rect x="56.0" y="864.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="898.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">PNPは共通0Vの入力へ、NPNは共通+24Vの入力へ。電流の向きで理解する</text>
<text x="76.0" y="920.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">PNP pairs with a 0V-common input; NPN with a +24V-common input. Understand it by current direction</text>
