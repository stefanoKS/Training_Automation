<text x="515.0" y="645.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="9" fill="#526378" font-weight="400" text-anchor="start">reset does not start motion</text>
<rect x="70.0" y="775.0" width="1300.0" height="80.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1.2"/>
<text x="90.0" y="805.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#142B3F" font-weight="700" text-anchor="start">指令（EXTEND/RETRACT）と確認（WAIT_EXTENDED/WAIT_RETRACTED）を分ける。</text>
<text x="90.0" y="827.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#142B3F" font-weight="400" text-anchor="start">確認が来なければタイムアウトでFAULT。リセットは動作開始ではない。</text>
<text x="90.0" y="845.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="10" fill="#526378" font-weight="400" text-anchor="start">A command is not a confirmation. Missing confirmation gives FAULT; reset is not a start.</text>
<rect x="56.0" y="904.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="938.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">状態ごとに出力と遷移条件を決める。位置確認とタイムアウトを状態に含める。</text>
<text x="76.0" y="960.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">Define outputs and transitions per state. Include position confirmation and timeouts in the states.</text>
