<text x="90.0" y="815.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">Y1 is only the delayed lamp; the solenoid is Y2. Addresses are not physical terminal numbers.</text>
<text x="90.0" y="836.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="400" text-anchor="start">実機の端子・コモン・保護・接地は、PLCと機器のマニュアルで確認する。</text>
