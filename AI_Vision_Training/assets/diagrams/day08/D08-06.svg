<text x="80.0" y="822.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">Think in a closed circuit through the input common. Confirm terminal arrangement in the PLC hardware manual.</text>
