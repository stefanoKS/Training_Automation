<text x="76.0" y="898.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">PNPはソース、NPNはシンク。PLC入力の共通端子の電位と入力方式で適合が決まる。</text>
<text x="76.0" y="920.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">PNP sources; NPN sinks. Compatibility depends on the input common potential and input circuit type.</text>
