<text x="80.0" y="676.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="18" fill="#142B3F" font-weight="700" text-anchor="start">直列＝すべて真で導通、並列＝どれか真で導通、反転＝真偽を入れ替えます。</text>
<text x="80.0" y="702.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">Series means all true; parallel means any true; invert swaps true and false.</text>
<text x="80.0" y="740.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#A32B2B" font-weight="700" text-anchor="start">すべてシミュレーション用の仮想入出力です。 / All inputs and outputs here are simulated training signals.</text>
<text x="80.0" y="766.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">実機の安全停止をこの論理だけで構成することはできません。 / This logic alone cannot form a real safety stop.</text>
<rect x="56.0" y="804.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
