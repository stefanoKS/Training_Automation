<text x="90.0" y="900.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・起動時RUN=OFF / RUN is OFF at power-up</text>
<text x="90.0" y="934.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・保持されたSTARTでは起動しない / a held START does not start</text>
<text x="90.0" y="968.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・STOPはSTARTより優先 / STOP precedes START</text>
<text x="90.0" y="1002.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・リセットは運転開始ではない / reset is not a start</text>
<rect x="750.0" y="820.0" width="620.0" height="240.0" rx="10" fill="#FFFFFF" stroke="#C1D0DD" stroke-width="1.4"/>
<text x="766.0" y="850.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="19" fill="#142B3F" font-weight="700" text-anchor="start">確認</text>
<text x="766.0" y="872.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#526378" font-weight="400" text-anchor="start">checks</text>
<text x="770.0" y="900.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・STARTを離して押し直すまで動かない / no motion until START is released and pressed</text>
<text x="770.0" y="934.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・許可が戻っても自動で動かない / restoring a permissive does not restart</text>
<text x="770.0" y="968.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・異常復帰でも自動で動かない / fault recovery does not restart</text>
<text x="770.0" y="1002.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・安全機能ではない / not a safety function</text>
<rect x="70.0" y="1090.0" width="1300.0" height="78.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1.2"/>
<text x="88.0" y="1120.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="700" text-anchor="start">シミュレーションは教育用モデル。実機PLCの実装や安全機能の証明ではない。</text>
<text x="88.0" y="1144.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">The simulation is a teaching model; it does not prove a real PLC implementation or a safety function.</text>
<rect x="56.0" y="1204.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
