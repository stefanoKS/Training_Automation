<rect x="70.0" y="660.0" width="1300.0" height="120.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1.4"/>
<text x="90.0" y="695.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="700" text-anchor="start">保護は電線と機器を守る。感電防止とは別。</text>
<text x="90.0" y="718.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#142B3F" font-weight="400" text-anchor="start">定格電圧・電流・遮断容量・電線保護・選択協調を確認する。</text>
<text x="90.0" y="742.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">Protection protects wiring and equipment, not people. Check ratings, breaking capacity, wire protection and coordination.</text>
<rect x="56.0" y="824.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="858.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">電源→保護→分岐→負荷。0V帰線と保護接地を忘れない。 / Supply, protection, branches, loads. Do not forget the 0 V return and protective earth.</text>
<text x="76.0" y="880.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">A DC distribution concept, not a panel construction drawing.</text>
