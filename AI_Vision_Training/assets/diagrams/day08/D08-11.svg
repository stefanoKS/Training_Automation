<rect x="60.0" y="710.0" width="1290.0" height="100.0" rx="8" fill="#F8E7E7" stroke="#A32B2B" stroke-width="1.4"/>
<text x="80.0" y="742.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#A32B2B" font-weight="700" text-anchor="start">リセットは動作開始ではない。復電時も、保持ビットや押しっぱなしのSTARTで自動再起動しない。</text>
<text x="80.0" y="765.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">Reset is not a start. Power restoration must not restart from a retained bit or a held START.</text>
<text x="80.0" y="790.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="600" text-anchor="start">通常のPLC制御と安全機能は別。この表は安全教育用で、安全PLCの設計ではない。</text>
