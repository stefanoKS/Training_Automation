<text x="76.0" y="878.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">異常の検出・応答・リセット・再起動をセットで設計する。 / Design detection, response, reset and restart together.</text>
<text x="76.0" y="900.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">A fault response without a restart rule is incomplete.</text>
