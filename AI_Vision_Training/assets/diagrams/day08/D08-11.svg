<text x="86.0" y="582.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#526378" font-weight="400" text-anchor="start">five situations</text>
<text x="90.0" y="600.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="400" text-anchor="start">1. STARTを離す → RUNが続く（保持）/ release START: RUN stays on</text>
<text x="90.0" y="640.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="400" text-anchor="start">2. STARTを押す → RUNになる / press START: RUN turns on</text>
<text x="90.0" y="680.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="400" text-anchor="start">3. 押してから離す → RUNのまま / press then release: still RUN</text>
<text x="90.0" y="720.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="400" text-anchor="start">4. STOP許可がOFF → RUNがOFF / permission OFF: RUN off</text>
<text x="90.0" y="760.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#A32B2B" font-weight="700" text-anchor="start">5. STOP許可が戻る → STARTを押しっぱなしだとRUNが戻る / permission restored: RUN returns while START is held</text>
<rect x="70.0" y="850.0" width="1300.0" height="78.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1.2"/>
<text x="88.0" y="880.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="700" text-anchor="start">基本回路は「記憶」の説明用。再起動防止の機能はない。</text>
<text x="88.0" y="904.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">The basic circuit explains memory; it has no restart prevention.</text>
<rect x="56.0" y="964.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="998.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">自己保持は並列のM0接点による。5番目の場面が拡張ロジックの出発点</text>
<text x="76.0" y="1020.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">Self-holding comes from the parallel M0 contact; situation 5 motivates the extended logic</text>
