<text x="1000.0" y="616.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">physical NC is not automatically</text>
<text x="1000.0" y="636.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">a logical NC instruction.</text>
<text x="1000.0" y="660.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="600" text-anchor="start">入力のON/OFFで論理を組み立てる。</text>
<rect x="56.0" y="714.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="748.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">スイッチは直接、リレーはコイルを介して接点を動かす。どちらも接点定格と負荷種別を確認する。</text>
<text x="76.0" y="770.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">A switch operates a contact directly; a relay uses a coil. Both require contact ratings and load-type checks.</text>
