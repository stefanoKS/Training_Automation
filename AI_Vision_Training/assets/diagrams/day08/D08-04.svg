<text x="270.0" y="316.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#526378" font-weight="400" text-anchor="middle">program</text>
<rect x="170.0" y="360.0" width="200.0" height="60.0" rx="4" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="1.6"/>
