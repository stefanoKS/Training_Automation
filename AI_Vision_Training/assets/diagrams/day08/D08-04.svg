<text x="468.0" y="300.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#6B3FA0" font-weight="600" text-anchor="middle">信号</text>
<path d="M1220.0 175.0 L1220.0 245.0" fill="none" stroke="#B4541E" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<path d="M1220.0 245.0 L1160.0 245.0" fill="none" stroke="#B4541E" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="1240.0" y="210.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#B4541E" font-weight="600" text-anchor="start">負荷電源</text>
<rect x="120.0" y="610.0" width="1200.0" height="90.0" rx="8" fill="#F8E7E7" stroke="#A32B2B" stroke-width="1.4"/>
<text x="140.0" y="645.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#A32B2B" font-weight="700" text-anchor="start">PLC出力は信号であり、無制限の電源ではない。定格を超える負荷はリレー等で間接操作する。</text>
<text x="140.0" y="670.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#526378" font-weight="400" text-anchor="start">A PLC output is a signal, not an unrestricted supply. Use a relay for loads above the rating.</text>
<rect x="56.0" y="734.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="768.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">信号の経路と、負荷に電力を届ける経路を分けて考える。 / Separate the signal path from the power path.</text>
<text x="76.0" y="790.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">Check per-point and per-common ratings, inrush, surge and leakage.</text>
