<text x="270.0" y="407.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="middle">relay or transistor</text>
<text x="150.0" y="470.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#6B3FA0" font-weight="700" text-anchor="start">Y0 / Y1 / Y2</text>
<rect x="520.0" y="230.0" width="300.0" height="130.0" rx="8" fill="#FFFFFF" stroke="#1F5C99" stroke-width="2"/>
<text x="670.0" y="262.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#1F5C99" font-weight="700" text-anchor="middle">リレー出力</text>
<text x="670.0" y="282.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="middle">relay output</text>
<text x="670.0" y="315.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="400" text-anchor="middle">接点で負荷回路を開閉</text>
<text x="670.0" y="338.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="middle">AC/DC, slower, contact life</text>
<rect x="520.0" y="400.0" width="300.0" height="130.0" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2"/>
<text x="670.0" y="432.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#1B7A4B" font-weight="700" text-anchor="middle">トランジスタ出力</text>
<text x="670.0" y="452.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="middle">transistor output</text>
<text x="670.0" y="485.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="400" text-anchor="middle">DC負荷, 速い, 漏れ電流</text>
<text x="670.0" y="508.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="middle">DC load, fast, leakage</text>
