<text x="90.0" y="678.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#142B3F" font-weight="400" text-anchor="start">M0の保持枝はX2を通らない。だから前進してX2がOFFになってもRUNを維持できる。</text>
<text x="90.0" y="702.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">The M0 seal-in branch does not pass through X2, so RUN survives X2 turning OFF.</text>
<rect x="70.0" y="760.0" width="1300.0" height="80.0" rx="8" fill="#F8E7E7" stroke="#A32B2B" stroke-width="1.3"/>
<text x="90.0" y="792.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#A32B2B" font-weight="700" text-anchor="start">元PDFの31ページには、この並列保持接点がない。STARTを離すとRUNが消える。</text>
<text x="90.0" y="815.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="11" fill="#526378" font-weight="400" text-anchor="start">The source PDF page 31 lacks this parallel holding contact, so RUN would drop when START is released.</text>
<rect x="56.0" y="884.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="918.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">STARTを離してもRUNが続く。STOP許可がOFFになるとRUNが落ち、T0もリセットされる。</text>
<text x="76.0" y="940.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">RUN survives START release. When stop permission goes OFF, RUN drops and T0 resets.</text>
