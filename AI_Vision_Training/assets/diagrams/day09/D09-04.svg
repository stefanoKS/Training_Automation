<rect x="1060.0" y="490.0" width="320.0" height="160.0" rx="8" fill="#F8E7E7" stroke="#A32B2B" stroke-width="1.2"/>
<text x="1080.0" y="522.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#A32B2B" font-weight="700" text-anchor="start">リンク・IP・アプリは別</text>
<text x="1080.0" y="545.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="600" text-anchor="start">ping OK ≠ Modbus OK</text>
<text x="1080.0" y="568.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="600" text-anchor="start">cable OK ≠ IP OK</text>
<text x="1080.0" y="591.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="600" text-anchor="start">IP OK ≠ application OK</text>
<text x="1080.0" y="620.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="10" fill="#526378" font-weight="400" text-anchor="start">each layer must be checked.</text>
<rect x="56.0" y="734.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="768.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">IPは機器、ポートはサービス、TCP/UDPは運び方、アプリはデータの意味を決める。</text>
<text x="76.0" y="790.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">IP selects the device, the port selects the service, TCP/UDP carry the data and the application defines its meaning.</text>
