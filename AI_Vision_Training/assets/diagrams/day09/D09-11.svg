<text x="80.0" y="356.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="19" fill="#142B3F" font-weight="700" text-anchor="start">平均値だけでは不十分です。最大値（ワーストケース）とばらつき（ジッタ）を見ます。</text>
<text x="80.0" y="382.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="400" text-anchor="start">Averages are not enough; examine worst-case values and jitter.</text>
