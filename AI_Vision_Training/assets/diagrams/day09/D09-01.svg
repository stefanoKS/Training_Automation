<text x="80.0" y="760.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#142B3F" font-weight="400" text-anchor="start">同じスイッチにつながっていても、別サブネットなら通常はルータが必要。 / A shared switch does not remove the need for a router between subnets.</text>
