<text x="80.0" y="520.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="19" fill="#142B3F" font-weight="700" text-anchor="start">各段階に時間があり、合計が「結果が出るまでの時間」になります。</text>
<text x="80.0" y="546.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="400" text-anchor="start">Every stage takes time; the total is the time until a result is available.</text>
<text x="80.0" y="582.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="18" fill="#B4541E" font-weight="700" text-anchor="start">バッファがいっぱいになると画像を取りこぼす可能性があります。</text>
<text x="80.0" y="608.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">A full buffer can cause images to be dropped.</text>
<text x="80.0" y="644.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#142B3F" font-weight="700" text-anchor="start">産業用PCとAIモデルは別の概念です。PCは実行環境、モデルは計算手法です。</text>
<text x="80.0" y="670.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">An industrial PC and an AI model are different: the PC is a platform, the model is a computation.</text>
<rect x="56.0" y="704.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="738.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">処理のどの段階が遅いかを測ることが、性能改善の第一歩です。</text>
<text x="76.0" y="760.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">Measure which stage is slow before optimising.</text>
