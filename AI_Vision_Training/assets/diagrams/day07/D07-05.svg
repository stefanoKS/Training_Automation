<text x="80.0" y="530.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="20" fill="#142B3F" font-weight="700" text-anchor="start">張力・しわ・蛇行は「見え方」を変えます。照明と機械の安定がAIの前提です。</text>
<text x="80.0" y="558.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="400" text-anchor="start">Tension, wrinkles and drift change appearance. Stable mechanics and lighting are prerequisites for AI.</text>
