<text x="980.0" y="660.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#B4541E" font-weight="400" text-anchor="start">※現金化できるかは別の話 / cash realisation is separate</text>
<rect x="70.0" y="740.0" width="1300.0" height="78.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1.2"/>
<text x="88.0" y="770.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="700" text-anchor="start">回収期間 = 導入費 ÷ 年間純効果。純効果が0以下なら回収期間は意味を持たない。</text>
<text x="88.0" y="794.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">Payback = investment ÷ annual net benefit. It is meaningless at zero or negative net benefit.</text>
<rect x="56.0" y="864.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="898.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">削減時間 → 年間工数 → 金額 → 純効果 → 回収期間の順に計算する</text>
<text x="76.0" y="920.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">Calculate in the order: time saved, annual hours, money, net benefit, payback</text>
