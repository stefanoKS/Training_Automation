<text x="88.0" y="714.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">Calculation narrows candidates; it is not the final selection.</text>
