<text x="104.0" y="222.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="21" fill="#2563A6" font-weight="700" text-anchor="start">デジタル / digital: ON/OFF</text>
<path d="M120.0 400.0 L660.0 400.0" fill="none" stroke="#2563A6" stroke-width="2"/>
<text x="104.0" y="390.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="700" text-anchor="start">1</text>
<text x="104.0" y="262.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="700" text-anchor="start">0</text>
<polyline points="130.0,260.0 181.0,260.0 181.0,260.0 293.2,260.0 293.2,396.0 410.5,396.0 410.5,260.0 527.8,260.0 527.8,396.0 640.0,396.0" fill="none" stroke="#2563A6" stroke-width="2.6"/>
