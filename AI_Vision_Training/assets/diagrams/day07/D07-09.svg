<text x="774.0" y="222.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="21" fill="#1B7A4B" font-weight="700" text-anchor="start">アナログ / analog: 連続値</text>
