<text x="76.0" y="1020.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">The cylinder moves, the guide aligns, the sensor measures state, the valve switches energy and the PLC issues signals.</text>
