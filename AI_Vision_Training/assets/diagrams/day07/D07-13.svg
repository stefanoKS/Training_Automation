<path d="M1090.0 530.0 L1090.0 610.0" fill="none" stroke="#A32B2B" stroke-width="3" marker-end="url(#arrow)"/>
<text x="840.0" y="660.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#A32B2B" font-weight="700" text-anchor="start">距離 × 力 がモーメント / distance × force is a moment</text>
<text x="880.0" y="500.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" font-weight="400" text-anchor="start">L [mm]</text>
<rect x="70.0" y="750.0" width="1300.0" height="78.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1.2"/>
<text x="88.0" y="780.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#142B3F" font-weight="700" text-anchor="start">位置決め精度は目標との差、繰返し精度は同じ指令でのばらつき。</text>
<text x="88.0" y="804.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">Positioning accuracy is the error to the target; repeatability is the spread for one command.</text>
<rect x="56.0" y="864.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
