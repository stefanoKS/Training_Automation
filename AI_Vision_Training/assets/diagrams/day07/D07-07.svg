<text x="80.0" y="622.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="19" fill="#142B3F" font-weight="700" text-anchor="start">PLCは小さな信号を出し、ドライバが大きな電力を供給します。</text>
<text x="80.0" y="648.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#526378" font-weight="400" text-anchor="start">The PLC issues a small signal; the driver supplies the large electrical power.</text>
<rect x="80.0" y="672.0" width="1280.0" height="62.0" rx="8" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="100.0" y="712.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17" fill="#142B3F" font-weight="700" text-anchor="start">空気圧シリンダ・電動シリンダもアクチュエータです。動力の種類が違うだけで役割は同じです。</text>
<rect x="56.0" y="764.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="798.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">アクチュエータは「指令」と「エネルギー」の両方が必要です。</text>
<text x="76.0" y="820.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">An actuator needs both a command and energy.</text>
