<circle cx="310.0" cy="508.0" r="8.0" fill="#FFFFFF" stroke="#B4541E" stroke-width="1.6"/>
<text x="325.0" y="514.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#B4541E" font-weight="600" text-anchor="start">残圧排気 / bleed</text>
<rect x="70.0" y="560.0" width="1300.0" height="210.0" rx="10" fill="#F8E7E7" stroke="#A32B2B" stroke-width="1.4"/>
<text x="90.0" y="595.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="16" fill="#A32B2B" font-weight="700" text-anchor="start">この図は概念です。実配管・弁型式・安全設計を確定するものではありません。</text>
<text x="90.0" y="622.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#526378" font-weight="400" text-anchor="start">This is a concept. It does not define piping, valve model or safety design.</text>
<text x="90.0" y="655.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・無通電の弁位置は機種で異なる。負荷・配管・トラップ空気で動き方が変わる。</text>
<text x="90.0" y="680.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#142B3F" font-weight="400" text-anchor="start">・遮断しただけでは残圧は抜けない。排気と零確認が必要。</text>
<text x="90.0" y="705.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14" fill="#A32B2B" font-weight="600" text-anchor="start">・電磁弁をOFFにしても、シリンダが安全な状態になる保証はない。</text>
<text x="90.0" y="730.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="12" fill="#526378" font-weight="400" text-anchor="start">De-energising a solenoid does not guarantee a safe cylinder state.</text>
<rect x="56.0" y="864.0" width="1328.0" height="60.0" rx="10" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
<text x="76.0" y="898.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="17.0" fill="#142B3F" font-weight="700" text-anchor="start">空気は 発生→遮断→空気準備→方向切替→速度制御→シリンダ の順に流れる。遮断・排気・零確認は別の対策。</text>
<text x="76.0" y="920.0" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="14.5" fill="#526378" font-weight="400" text-anchor="start">Air flows source, isolation, preparation, directional valve, flow control, cylinder. Isolation, bleed and zero verification are separate measures.</text>
<text x="1400" y="972" font-family="Arial, 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="15" fill="#526378" text-anchor="end">D07-07 • 編集可能な図 / editable SVG</text>
</svg>
