<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">架空データ・機密情報・設備接続を分ける</title><desc id="desc">Privacy &amp; safety: allowed examples vs prohibited data and actions</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#526378" /></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#B84545" /></marker></defs><rect width="1440" height="900" fill="#F5F8FC" /><rect width="1440" height="12" fill="#2563A6" /><text x="64" y="64" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#2563A6" font-weight="700" text-anchor="start">DAY 06  /  AI × SOFTWARE DEVELOPMENT</text><text x="64" y="114" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="35" fill="#142B3F" font-weight="700" text-anchor="start">架空データ・機密情報・設備接続を分ける</text><text x="64" y="151" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#526378" font-weight="400" text-anchor="start">Privacy &amp; safety: allowed examples vs prohibited data and actions</text><rect x="64" y="242" width="400" height="407" rx="16" fill="white" stroke="#087F79" stroke-width="2" /><rect x="64" y="242" width="7" height="407" rx="2" fill="#087F79" stroke="#087F79" stroke-width="2" /><text x="83" y="282" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#087F79" font-weight="700" text-anchor="start">安全な例 / Fictional data</text><text x="83" y="322" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">架空のロット PVC-EX-001</text><text x="83" y="353" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">架空の欠陥 黒点 / 傷</text><text x="83" y="384" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">Synthetic sample records only</text><text x="83" y="415" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">ローカル試作に限定</text><rect x="520" y="242" width="400" height="407" rx="16" fill="white" stroke="#B84545" stroke-width="2" /><rect x="520" y="242" width="7" height="407" rx="2" fill="#B84545" stroke="#B84545" stroke-width="2" /><text x="539" y="282" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#B84545" font-weight="700" text-anchor="start">入力しない / Sensitive</text><text x="539" y="322" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">個人情報・顧客情報</text><text x="539" y="353" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">実際の生産記録・機密情報</text><text x="539" y="384" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">No real IDs or trade secrets</text><text x="539" y="415" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">AIへの入力から除外</text><rect x="976" y="242" width="400" height="407" rx="16" fill="white" stroke="#BB7514" stroke-width="2" /><rect x="976" y="242" width="7" height="407" rx="2" fill="#BB7514" stroke="#BB7514" stroke-width="2" /><text x="995" y="282" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#BB7514" font-weight="700" text-anchor="start">接続しない / Production</text><text x="995" y="322" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">設備制御・生産システム</text><text x="995" y="353" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">本番DBや外部サービス</text><text x="995" y="384" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">No equipment / production ops</text><text x="995" y="415" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">承認なく変更・送信しない</text><rect x="64" y="717" width="1312" height="61" rx="12" fill="#EAF6F4" stroke="#B84545" stroke-width="2" /><text x="85" y="756" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#B84545" font-weight="700" text-anchor="start">境界 / Boundary</text><text x="415" y="756" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">架空データだけで試す。機密を除外し、生産設備から切り離す。</text><text x="1376" y="868" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#526378" font-weight="400" text-anchor="end">D06-14  •  LOCAL / EDITABLE SVG</text></svg>