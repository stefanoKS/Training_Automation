<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">要件を9分類する  /  Nine requirement categories</title><desc id="desc">PVC不良記録の例：合意できる入力・動作・境界・完了条件</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#526378" /></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#B84545" /></marker></defs><rect width="1440" height="900" fill="#F5F8FC" /><rect width="1440" height="12" fill="#2563A6" /><text x="64" y="64" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#2563A6" font-weight="700" text-anchor="start">DAY 06  /  AI × SOFTWARE DEVELOPMENT</text><text x="64" y="114" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="35" fill="#142B3F" font-weight="700" text-anchor="start">要件を9分類する  /  Nine requirement categories</text><text x="64" y="151" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#526378" font-weight="400" text-anchor="start">PVC不良記録の例：合意できる入力・動作・境界・完了条件</text><rect x="64" y="212" width="400" height="178" rx="16" fill="white" stroke="#2563A6" stroke-width="2" /><rect x="64" y="212" width="7" height="178" rx="2" fill="#2563A6" stroke="#2563A6" stroke-width="2" /><text x="83" y="252" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#2563A6" font-weight="700" text-anchor="start">1 利用者 / Users</text><text x="83" y="292" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">検査担当者が入力</text><text x="83" y="323" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">管理者が一覧を確認</text><rect x="520" y="212" width="400" height="178" rx="16" fill="white" stroke="#2563A6" stroke-width="2" /><rect x="520" y="212" width="7" height="178" rx="2" fill="#2563A6" stroke="#2563A6" stroke-width="2" /><text x="539" y="252" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#2563A6" font-weight="700" text-anchor="start">2 目的 / Goal</text><text x="539" y="292" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">塩ビシートの不良を記録</text><text x="539" y="323" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">架空データで試作</text><rect x="976" y="212" width="400" height="178" rx="16" fill="white" stroke="#2563A6" stroke-width="2" /><rect x="976" y="212" width="7" height="178" rx="2" fill="#2563A6" stroke="#2563A6" stroke-width="2" /><text x="995" y="252" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#2563A6" font-weight="700" text-anchor="start">3 必須入力 / Required</text><text x="995" y="292" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">ロット・検査日時</text><text x="995" y="323" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">種類：黒点 / 傷 / すじ</text><rect x="64" y="413" width="400" height="178" rx="16" fill="white" stroke="#087F79" stroke-width="2" /><rect x="64" y="413" width="7" height="178" rx="2" fill="#087F79" stroke="#087F79" stroke-width="2" /><text x="83" y="453" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#087F79" font-weight="700" text-anchor="start">4 任意入力 / Optional</text><text x="83" y="493" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">不良の説明・備考</text><text x="83" y="524" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Description / Remarks</text><rect x="520" y="413" width="400" height="178" rx="16" fill="white" stroke="#087F79" stroke-width="2" /><rect x="520" y="413" width="7" height="178" rx="2" fill="#087F79" stroke="#087F79" stroke-width="2" /><text x="539" y="453" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#087F79" font-weight="700" text-anchor="start">5 操作 / Actions</text><text x="539" y="493" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">保存・一覧表示</text><text x="539" y="524" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Save / list records</text><rect x="976" y="413" width="400" height="178" rx="16" fill="white" stroke="#087F79" stroke-width="2" /><rect x="976" y="413" width="7" height="178" rx="2" fill="#087F79" stroke="#087F79" stroke-width="2" /><text x="995" y="453" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#087F79" font-weight="700" text-anchor="start">6 検索 / Filters</text><text x="995" y="493" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">ロット・種類で絞る</text><text x="995" y="524" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Filter by lot / type</text><rect x="64" y="614" width="400" height="178" rx="16" fill="white" stroke="#BB7514" stroke-width="2" /><rect x="64" y="614" width="7" height="178" rx="2" fill="#BB7514" stroke="#BB7514" stroke-width="2" /><text x="83" y="654" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#BB7514" font-weight="700" text-anchor="start">7 出力 / Outputs</text><text x="83" y="694" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">表示件数・CSV出力</text><text x="83" y="725" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Visible count / export</text><rect x="520" y="614" width="400" height="178" rx="16" fill="white" stroke="#BB7514" stroke-width="2" /><rect x="520" y="614" width="7" height="178" rx="2" fill="#BB7514" stroke="#BB7514" stroke-width="2" /><text x="539" y="654" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#BB7514" font-weight="700" text-anchor="start">8 制約 / Boundaries</text><text x="539" y="694" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">実データ・設備接続なし</text><text x="539" y="725" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Local fictional prototype</text><rect x="976" y="614" width="400" height="178" rx="16" fill="white" stroke="#BB7514" stroke-width="2" /><rect x="976" y="614" width="7" height="178" rx="2" fill="#BB7514" stroke="#BB7514" stroke-width="2" /><text x="995" y="654" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#BB7514" font-weight="700" text-anchor="start">9 合格条件 / Acceptance</text><text x="995" y="694" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">必須欄の検証と保存</text><text x="995" y="725" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">絞込・CSVを人が確認</text><text x="1376" y="868" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#526378" font-weight="400" text-anchor="end">D06-07  •  LOCAL / EDITABLE SVG</text></svg>