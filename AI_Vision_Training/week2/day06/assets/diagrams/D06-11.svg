idth="2" /><text x="881" y="298" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#087F79" font-weight="700" text-anchor="start">4 テスト</text><text x="881" y="338" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#142B3F" font-weight="400" text-anchor="start">実装後に動作検証</text><text x="881" y="369" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#142B3F" font-weight="400" text-anchor="start">Tests pass</text><path d="M1114 402 L1122 402" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="1128" y="258" width="248" height="303" rx="16" fill="white" stroke="#2563A6" stroke-width="2" /><rect x="1128" y="258" width="7" height="303" rx="2" fill="#2563A6" stroke="#2563A6" stroke-width="2" /><text x="1147" y="298" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#2563A6" font-weight="700" text-anchor="start">5 人の受入</text><text x="1147" y="338" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#142B3F" font-weight="400" text-anchor="start">利用者目線で採否</text><text x="1147" y="369" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#142B3F" font-weight="400" text-anchor="start">Human acceptance</text><path d="M1252 570 L1252 623 L190 623 L190 573" fill="none" stroke="#B84545" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#return)" /><text x="728" y="613" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#B84545" font-weight="700" text-anchor="middle">不合格なら要件へ / Human rejects → revisit requirements</text><path d="M986 570 L986 669 L720 669 L720 573" fill="none" stroke="#B84545" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#return)" /><text x="851" y="660" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#B84545" font-weight="700" text-anchor="middle">テスト失敗 → 範囲/実装を修正</text><path d="M720 570 L720 716 L454 716 L454 573" fill="none" stroke="#B84545" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#return)" /><text x="589" y="706" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#B84545" font-weight="700" text-anchor="middle">範囲外 → PLANを修正</text><rect x="64" y="759" width="1312" height="61" rx="12" fill="#EAF6F4" stroke="#B84545" stroke-width="2" /><text x="85" y="798" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#B84545" font-weight="700" text-anchor="start">各ゲート / At each gate</text><text x="415" y="798" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">証拠を確認 → 承認または差し戻し → 再確認</text><text x="1376" y="868" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#526378" font-weight="400" text-anchor="end">D06-11  •  LOCAL / EDITABLE SVG</text></svg>