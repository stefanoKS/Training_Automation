<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">人 → ChatGPT → コーディングエージェント</title><desc id="desc">仕様と計画を人が別々に承認してから、実装を依頼する</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#526378" /></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#B84545" /></marker></defs><rect width="1440" height="900" fill="#F5F8FC" /><rect width="1440" height="12" fill="#2563A6" /><text x="64" y="64" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#2563A6" font-weight="700" text-anchor="start">DAY 06  /  AI × SOFTWARE DEVELOPMENT</text><text x="64" y="114" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="35" fill="#142B3F" font-weight="700" text-anchor="start">人 → ChatGPT → コーディングエージェント</text><text x="64" y="151" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#526378" font-weight="400" text-anchor="start">仕様と計画を人が別々に承認してから、実装を依頼する</text><rect x="64" y="242" width="296" height="176" rx="16" fill="white" stroke="#2563A6" stroke-width="2" /><rect x="64" y="242" width="7" height="176" rx="2" fill="#2563A6" stroke="#2563A6" stroke-width="2" /><text x="83" y="282" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#2563A6" font-weight="700" text-anchor="start">1 人 / Human</text><text x="83" y="322" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">課題・制約を伝える</text><path d="M365 330 L390 330" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="396" y="242" width="296" height="176" rx="16" fill="white" stroke="#087F79" strok