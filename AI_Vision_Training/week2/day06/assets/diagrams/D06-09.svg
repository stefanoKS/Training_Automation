ke-width="2" /><text x="85" y="795" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#B84545" font-weight="700" text-anchor="start">責任 / Ownership</text><text x="415" y="795" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">仕様レビューと計画レビューは別ゲート。AIの提案を人が採否判断。</text><text x="1376" y="868" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#526378" font-weight="400" text-anchor="end">D06-09  •  LOCAL / EDITABLE SVG</text></svg>