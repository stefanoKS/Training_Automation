<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">モデル・アシスタント・エージェント・ハーネス</title><desc id="desc">能力と実行環境を分ける / Distinguish model, interface, agent loop, runtime</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#526378" /></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#B84545" /></marker></defs><rect width="1440" height="900" fill="#F5F8FC" /><rect width="1440" height="12" fill="#2563A6" /><text x="64" y="64" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#2563A6" font-weight="700" text-anchor="start">DAY 06  /  AI × SOFTWARE DEVELOPMENT</text><text x="64" y="114" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="35" fill="#142B3F" font-weight="700" text-anchor="start">モデル・アシスタント・エージェント・ハーネス</text><text x="64" y="151" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#526378" font-weight="400" text-anchor="start">能力と実行環境を分ける / Distinguish model, interface, agent loop, runtime</text><rect x="64" y="256" width="296" height="370" rx="16" fill="white" stroke="#2563A6" stroke-width="2" /><rect x="64" y="256" width="7" height="370" rx="2" fill="#2563A6" stroke="#2563A6" stroke-width="2" /><text x="83" y="296" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#2563A6" font-weight="700" text-anchor="start">モデル / Model</text><text x="83" y="336" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">入力からトークンを予測</text><text x="83" y="367" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Generates outputs; no direct</text><text x="83" y="398" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">file or tool access by itself</text><path d="M364 443 L388 443" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="396" y="256" width="296" height="370" rx="16" fill="white" stroke="#087F79" stroke-width="2" /><rect x="396" y="256" width="7" height="370" rx="2" fill="#087F79" stroke="#087F79" stroke-width="2" /><text x="415" y="296" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#087F79" font-weight="700" text-anchor="start">アシスタント / Assistant</text><text x="415" y="336" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">会話の窓口と文脈</text><text x="415" y="367" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Conversational interface</text><text x="415" y="398" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">User steers the exchange</text><path d="M696 443 L720 443" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="728" y="256" width="296" height="370" rx="16" fill="white" stroke="#BB7514" stroke-width="2" /><rect x="728" y="256" width="7" height="370" rx="2" fill="#BB7514" stroke="#BB7514" stroke-width="2" /><text x="747" y="296" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#BB7514" font-weight="700" text-anchor="start">エージェント / Agent</text><text x="747" y="336" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">目標→行動→観測を反復</text><text x="747" y="367" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Plans and requests tools</text><text x="747" y="398" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Results feed the next step</text><path d="M1028 443 L1052 443" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="1060" y="256" width="296" height="370" rx="16" fill="white" stroke="#526378" stroke-width="2" /><rect x="1060" y="256" width="7" height="370" rx="2" fill="#526378" stroke="#526378" stroke-width="2" /><text x="1079" y="296" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#526378" font-weight="700" text-anchor="start">ハーネス / Harness</text><text x="1079" y="336" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">モデル・ツールを接続</text><text x="1079" y="367" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">Runtime: state, permissions,</text><text x="1079" y="398" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="19" fill="#142B3F" font-weight="400" text-anchor="start">tools and result delivery</text><rect x="64" y="708" width="1312" height="61" rx="12" fill="#EAF6F4" stroke="#B84545" stroke-width="2" /><text x="85" y="747" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#B84545" font-weight="700" text-anchor="start">重要 / Distinction</text><text x="415" y="747" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">モデルの提案と、ハーネスが許可して実行する操作は別物</text><text x="1376" y="868" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#526378" font-weight="400" text-anchor="end">D06-03  •  LOCAL / EDITABLE SVG</text></svg>