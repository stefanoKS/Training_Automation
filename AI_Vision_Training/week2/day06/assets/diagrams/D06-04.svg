<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">エージェント実行アーキテクチャと許可ループ</title><desc id="desc">Model proposes → harness checks → human approves sensitive actions → tools report back</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#526378"/></marker></defs><rect width="1440" height="900" fill="#F5F8FC"/><rect width="1440" height="12" fill="#2563A6"/><text x="64" y="64" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#2563A6" font-weight="700" text-anchor="start">DAY 06  /  AI × SOFTWARE DEVELOPMENT</text><text x="64" y="114" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="36" fill="#142B3F" font-weight="700" text-anchor="start">エージェント実行アーキテクチャと許可ループ</text><text x="64" y="152" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="22" fill="#526378" font-weight="400" text-anchor="start">Model proposes → harness checks → human approves sensitive actions → tools report back</text><rect x="64" y="236" width="320" height="186" rx="16" fill="white" stroke="#2563A6" stroke-width="2"/><rect x="64" y="236" width="8" height="186" rx="3" fill="#2563A6" stroke="#2563A6" stroke-width="2"/><text x="86" y="277" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="24" fill="#2563A6" font-weight="700" text-anchor="start">モデル / Model</text><text x="86" y="319" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">次の操作を提案する</text><text x="86" y="351" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">Proposes a tool request</text><rect x="534" y="236" width="372" height="186" rx="16" fill="white" stroke="#087F79" stroke-width="2"/><rect x="534" y="236" width="8" height="186" rx="3" fill="#087F79" stroke="#087F79" stroke-width="2"/><text x="556" y="277" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="24" fill="#087F79" font-weight="700" text-anchor="start">ハーネス / Harness</text><text x="556" y="319" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">権限・範囲を確認する</text><text x="556" y="351" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">Permission check / policy</text><rect x="1056" y="236" width="320" height="186" rx="16" fill="white" stroke="#BB7514" stroke-width="2"/><rect x="1056" y="236" width="8" height="186" rx="3" fill="#BB7514" stroke="#BB7514" stroke-width="2"/><text x="1078" y="277" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="24" fill="#BB7514" font-weight="700" text-anchor="start">人の承認 / Human</text><text x="1078" y="319" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">機微な操作のみ承認</text><text x="1078" y="351" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">Sensitive ops: approve / deny</text><rect x="1056" y="557" width="320" height="159" rx="16" fill="white" stroke="#526378" stroke-width="2"/><rect x="1056" y="557" width="8" height="159" rx="3" fill="#526378" stroke="#526378" stroke-width="2"/><text x="1078" y="598" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="24" fill="#526378" font-weight="700" text-anchor="start">ツール実行 / Tool</text><text x="1078" y="640" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">許可後にだけ実行する</text><text x="1078" y="672" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">Execute approved action</text><rect x="534" y="557" width="372" height="159" rx="16" fill="white" stroke="#087F79" stroke-width="2"/><rect x="534" y="557" width="8" height="159" rx="3" fill="#087F79" stroke="#087F79" stroke-width="2"/><text x="556" y="598" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="24" fill="#087F79" font-weight="700" text-anchor="start">観測結果 / Result</text><text x="556" y="640" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">出力・差分・テスト結果</text><text x="556" y="672" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">Evidence returned to model</text><rect x="64" y="557" width="320" height="159" rx="16" fill="white" stroke="#2563A6" stroke-width="2"/><rect x="64" y="557" width="8" height="159" rx="3" fill="#2563A6" stroke="#2563A6" stroke-width="2"/><text x="86" y="598" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="24" fill="#2563A6" font-weight="700" text-anchor="start">次の要求 / Next step</text><text x="86" y="640" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">結果から次の操作を決める</text><text x="86" y="672" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="20" fill="#142B3F" font-weight="400" text-anchor="start">Inspect → request again</text><path d="M394 322 L520 322" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="457" y="302" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#526378" font-weight="700" text-anchor="middle">① 提案 / Propose</text><path d="M917 322 L1043 322" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="980" y="302" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#BB7514" font-weight="700" text-anchor="middle">② 要承認 / Ask</text><path d="M1216 433 L1216 546" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1230" y="504" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#BB7514" font-weight="700" text-anchor="start">③ 承認後 / Approved</text><path d="M875 433 L875 475 L1040 475 L1040 591" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="879" y="464" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="17" fill="#087F79" font-weight="700" text-anchor="start">許可済み / Pre-authorized</text><path d="M1042 636 L920 636" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="981" y="616" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="17" fill="#526378" font-weight="700" text-anchor="middle">④ 実行結果 / Observe</text><path d="M520 636 L398 636" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="459" y="616" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="17" fill="#087F79" font-weight="700" text-anchor="middle">⑤ 結果を渡す / Return</text><path d="M224 546 L224 434" fill="none" stroke="#526378" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="238" y="498" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="18" fill="#2563A6" font-weight="700" text-anchor="start">⑥ 次のモデル要求</text><rect x="64" y="770" width="1312" height="58" rx="12" fill="#EAF6F4" stroke="#087F79" stroke-width="2"/><text x="88" y="808" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="23" fill="#087F79" font-weight="700" text-anchor="start">原則 / Principle</text><text x="340" y="808" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="21" fill="#142B3F" font-weight="400" text-anchor="start">モデルは提案、ハーネスは権限を制御。未承認の機微操作は実行しない。</text><text x="1376" y="868" font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif" font-size="17" fill="#526378" font-weight="400" text-anchor="end">D06-04  •  LOCAL / EDITABLE SVG</text></svg>
